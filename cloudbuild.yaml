
steps:
  - name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r requirements.txt
        python -m py_compile app.py

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - demo-app:$COMMIT_SHA
      - .

options:
  logging: CLOUD_LOGGING_ONLY
